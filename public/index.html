<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Analizando archivos con AWS</h1>
<!- AI -!>
<section>
    <form id="uploadForm">
        <div>
            <label>Selecionar imagen</label>
            <input type="file" name="imagen" accept="image/*" required>
        </div>
        <button type="submit">Enviar</button>
    </form>

    <div>
        <h3>Resultados de analisis</h3>
        <ul id="listaEtiquetas"></ul>
    </div>
</section>

<!- OCR -!>
<section>
    <form id="ocrForm">
        <div>
            <label>Selecionar imagen</label>
            <input type="file" name="file" accept="application/pdf" required>
        </div>
        <button type="submit">Enviar</button>
    </form>

    <div>
        <h3>Resultados de analisis</h3>
        <p id="respuestaOcr"></p>
    </div>
</section>

<script>
    const iaForm = document.getElementById("uploadForm")
    const ocrForm = document.getElementById("ocrForm")
    const listaEtiquetas = document.getElementById("listaEtiquetas")
    const respuestaOcr = document.getElementById("respuestaOcr")


    iaForm.addEventListener("submit", async (e) => {
        e.preventDefault() //Detenemos el envio

        //FormData = contenedor de datos
        const formData = new FormData(iaForm)

        listaEtiquetas.innerHTML = `<li>Analizando imagen con AWS...<li>`

        //Enviar los datos por el API

        try {
            const response = await fetch('/api/analizar', {
                method: 'POST',
                body: formData
            })
            //El servicio AWS inica la resolucion

            const data = await response.json()

            if (data.success) {
                listaEtiquetas.innerHTML = ``
                data.labels.forEach(label => {
                    const li = document.createElement("li")
                    li.innerHTML = `Imagen: ${label.Name} - confianza: ${label.Confidence}`
                    listaEtiquetas.appendChild(li)
                })
            } else {


                //Cuidado: no se deben exponer todos los errores
                //¿como se manejan los errores en backend
                listaEtiquetas.innerHTML = `
          <li>${data.error}</li>
          <li>${data.details}</li>
          <li>${data.code}</li>

          `

            }

        } catch (error) {
            console.error(error)
            listaEtiquetas.innerHTML = `<li>Error de conexion </li>`
        }


    })

    ocrForm.addEventListener("submit", async (e) => {
        e.preventDefault()
        respuestaOcr.innerHTML = "Cargando..."
        try {
            const formData = new FormData(ocrForm)

            const response = await fetch('/api/ocr', {
                method: 'POST',
                body: formData
            })

            const data = await response.json()

            if (data.succes) {
                respuestaOcr.innerHTML = data.value
            } else {
                respuestaOcr.innerHTML = "Upss... ocurrió un error: "+ data.error
            }
        } catch (error) {
            console.error(error)
            listaEtiquetas.innerHTML = `<li>Error de conexion </li>`
        }
    })

</script>
</body>
</html>
